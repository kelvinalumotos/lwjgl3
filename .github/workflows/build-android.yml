name: Android build

on: [workflow_dispatch, push]

jobs:
  build:
    strategy:
      matrix:
        # QuestCraft only ships arm64 (Meta Quest)
        arch: [ "arm64" ]
      fail-fast: false

    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: |
            8
            25

    - name: Build for Android ${{matrix.arch}}
      run: |
        export JAVA8_HOME=$JAVA_HOME_8_${{runner.arch}}
        export LWJGL_BUILD_ARCH=${{matrix.arch}}
        export GENERATE_OPENXR=1
        bash ci_build_android.bash

    # Commit these back into the branch so later builds no longer need the generator pass
    - name: Upload regenerated OpenXR sources
      uses: actions/upload-artifact@v4
      with:
        name: lwjgl-3.4.1-openxr-generated
        path: modules/lwjgl/openxr/src/generated

    - name: Upload modules release output
      uses: actions/upload-artifact@v4
      with:
        name: lwjgl-3.4.1-android-modules
        path: bin/RELEASE

    - name: Upload native build output
      uses: actions/upload-artifact@v4
      with:
        name: lwjgl-3.4.1-android-natives-${{matrix.arch}}
        path: bin/out
